name: Daily Automated Database Backup

on:
  schedule:
    # Runs daily at 02:00 UTC (14-day retention cycle)
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    name: Run Encrypted Database Backup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @intentlock/shared

      - name: Execute Encrypted Database Backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: npm run backup

      - name: Upload Encrypted Backup Artifact (Stored securely outside repository)
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-database-backup
          path: backups/*.enc
          retention-days: 14
